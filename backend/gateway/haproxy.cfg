# Brightloop API gateway
#
# Public entry point for the microservices. Routes by path prefix, performs
# health checks, applies a simple per-IP rate limit and a draft bearer-token
# presence check.

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect      5s
    timeout client       30s
    timeout server       30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    retries 3

frontend api_gateway
    bind *:8080
    mode http

    # Simple per-IP rate limit: 100 requests per 10 seconds.
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    # Gateway health endpoint (does not touch the services).
    acl gateway_health path /health
    http-request return status 200 content-type text/plain string "ok\n" if gateway_health

    # Route by path prefix. Services expose the same prefix internally.
    acl auth_path         path_beg /api/v1/auth
    acl user_path         path_beg /api/v1/users
    acl subscription_path path_beg /api/v1/subscriptions
    acl subscription_alias_path path_beg /api/subscriptions
    acl notification_path path_beg /api/v1/notifications

    # CORS preflight requests must reach the service before the bearer check.
    acl is_options method OPTIONS
    http-request allow if is_options

    # Draft authentication filter: protected routes require a bearer header.
    # This only checks that the header exists. Replace with forward-auth/SPOE
    # (or validate in the auth service) to verify the JWT signature.
    acl protected  path_beg /api/v1/users /api/v1/subscriptions /api/subscriptions /api/v1/notifications
    acl has_bearer hdr(Authorization) -m beg "Bearer "
    http-request deny deny_status 401 if protected !has_bearer

    use_backend auth_service         if auth_path
    use_backend user_service         if user_path
    use_backend subscription_service if subscription_path
    use_backend subscription_service if subscription_alias_path
    use_backend notification_service if notification_path
    default_backend auth_service

backend auth_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server auth_1 auth:8081 check inter 5s fall 3 rise 2

backend user_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server user_1 user:8082 check inter 5s fall 3 rise 2

backend subscription_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server subscription_1 subscription:8083 check inter 5s fall 3 rise 2

backend notification_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server notification_1 notification:8084 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
