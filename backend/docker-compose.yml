name: brightloop-backend

services:
  gateway:
    image: haproxy:2.9-alpine
    container_name: brightloop-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${GATEWAY_STATS_PORT:-8404}:8404"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - auth
      - user
      - subscription
      - notification

  auth:
    build:
      context: ./services/auth
    container_name: brightloop-auth
    environment:
      PORT: "8081"
      GIN_MODE: release
    expose:
      - "8081"

  user:
    build:
      context: ./services/user
    container_name: brightloop-user
    environment:
      PORT: "8082"
      GIN_MODE: release
    expose:
      - "8082"

  subscription:
    build:
      context: ./services/subscription
    container_name: brightloop-subscription
    environment:
      PORT: "8083"
      GIN_MODE: release
    expose:
      - "8083"

  notification:
    build:
      context: ./services/notification
    container_name: brightloop-notification
    environment:
      PORT: "8084"
      GIN_MODE: release
    expose:
      - "8084"
