name: brightloop-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightloop}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  gateway:
    image: haproxy:2.9-alpine
    container_name: brightloop-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${FRONTEND_API_PORT:-3000}:8080"
      - "${GATEWAY_STATS_PORT:-8404}:8404"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - auth
      - user
      - subscription
      - notification

  auth:
    build:
      context: ./services/auth
    container_name: brightloop-auth
    environment:
      PORT: "8081"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL:-postgres://brightloop:brightloop@postgres:5432/brightloop?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"

  user:
    build:
      context: ./services/user
    container_name: brightloop-user
    environment:
      PORT: "8082"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL:-postgres://brightloop:brightloop@postgres:5432/brightloop?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8082"

  subscription:
    build:
      context: ./services/subscription
    container_name: brightloop-subscription
    environment:
      PORT: "8083"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL:-postgres://brightloop:brightloop@postgres:5432/brightloop?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET:-}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-false}"
      AUTH_DEFAULT_ROLE: "${AUTH_DEFAULT_ROLE:-admin}"
      REPORTING_CURRENCY: "${REPORTING_CURRENCY:-USD}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8083"

  notification:
    build:
      context: ./services/notification
    container_name: brightloop-notification
    environment:
      PORT: "8084"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL:-postgres://brightloop:brightloop@postgres:5432/brightloop?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8084"

volumes:
  postgres-data:
